name: Publish HR, CX, Finance, Procurement and Supply Chain and Business Transformation sites

# Rebuilds the HR, CRM and FI GitHub Pages sites from the repo content on every push.
on:
  push:
    branches: [main]
    paths:
      - "01-HR-Human-Capital-Capability-Academy-Workforce-Monday/**"
      - "02-CRM-Customer-Experience-Capability-Academy-Revenue-Tuesday/**"
      - "03-FI-Finance-Capability-Academy-Finance-Wednesday/**"
      - "04-PROC-Procurement-Capability-Academy-Procurement-Thursday/**"
      - "05-SCM-Supply-Chain-Management-Capability-Academy-Supply-Chain-Friday/**"
      - "06-BTM-Business-Transformation-Capability-Academy-Transformation-Saturday/**"
      - "07-LIT-Leadership-and-Identity-Transformation-Capability-Academy-Source-Sunday/**"
      - "docs/btm11-demos/**"
      - "tools/hr-site/**"
      - ".github/workflows/hr-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hr-site-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: Build sites
        run: python3 src/tools/hr-site/build.py "$GITHUB_WORKSPACE/_site"
      - name: Check wording rules
        run: |
          if grep -rliE "fictional|pwc|deloitte" _site --include=*.html; then echo "Banned wording found"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish to gh-pages (only HR folders are touched)
        run: |
          cd pages
          rm -rf academies hr hr[0-9][0-9] crm crm[0-9][0-9] fi fi[0-9][0-9] proc proc[0-9][0-9] scm scm[0-9][0-9] btm btm[0-9][0-9] lit lit[0-9][0-9]
          cp -r ../_site/academies ../_site/hr ../_site/hr[0-9][0-9] ../_site/crm ../_site/crm[0-9][0-9] ../_site/fi ../_site/fi[0-9][0-9] ../_site/proc ../_site/proc[0-9][0-9] ../_site/scm ../_site/scm[0-9][0-9] ../_site/btm ../_site/btm[0-9][0-9] ../_site/lit ../_site/lit[0-9][0-9] .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No site changes"; exit 0; fi
          git commit -m "Auto-publish HR sites from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
