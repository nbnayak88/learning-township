# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout generated academy pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _published
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble static HTML site without Jekyll
        run: |
          mkdir -p _site
          # Preserve 84 generated workstream pages from gh-pages; main does not contain them.
          rsync -a --exclude=.git _published/ _site/
          # Overlay source-maintained pages without deleting generated academy routes.
          rsync -a --exclude=.git --exclude=_site --exclude=_published --exclude=.github --exclude=docs ./ _site/
          cp -a docs/. _site/
          mkdir -p _site/docs/superlabs
          cp docs/superlabs/index.html _site/docs/superlabs/index.html
          touch _site/.nojekyll
          test -s _site/thr81-checklist/index.html
          echo "THR81 and docs content staged for GitHub Pages"
      - name: Apply global SuccessLabs certification CTA to all HTML pages
        run: |
          python3 tools/cta/inject.py _site
          python3 tools/cta/inject.py _site --check
      - name: Validate published entry points
        run: |
          test -s _site/thr81-checklist/index.html
          test -s _site/qualtrics-ex-demo/index.html
          test -s _site/superlabs/learn/index.html
          test -s _site/superlabs/index.html
          test -s _site/docs/superlabs/index.html
          for domain in hr crm fi proc scm btm lit; do
            test -s "_site/$domain/index.html"
            for n in $(seq -w 1 12); do
              test -s "_site/${domain}${n}/index.html" || { echo "Missing: ${domain}${n}/index.html"; exit 1; }
            done
          done
          test -s _site/pages-index/index.html
          grep -q 'sla-membership-cta-v2:begin' _site/pages-index/index.html
          echo "Static site entry points present, including both SuperLabs URLs and membership CTA"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
