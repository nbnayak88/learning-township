<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460"><rect width="1100" height="460" fill="#f3fbf5"/><g font-family="Arial" fill="#17432c"><text x="35" y="45" font-size="26" font-weight="bold">Industrials — Pixaera to SAP Learning</text><text x="35" y="72" font-size="16">CPI integration with separated SSH key trust boundaries</text></g><g stroke="#73ae87" stroke-width="2"><rect x="30" y="115" width="220" height="170" rx="12" fill="#e4f7e8"/><rect x="300" y="115" width="220" height="170" rx="12" fill="#eaf1ff"/><rect x="570" y="115" width="220" height="170" rx="12" fill="#e6f7ef"/><rect x="840" y="115" width="230" height="170" rx="12" fill="#fff3dc"/></g><g font-family="Arial" fill="#17432c" text-anchor="middle"><text x="140" y="160" font-size="19" font-weight="bold">Pixaera</text><text x="140" y="195" font-size="15">Vendor SSH key</text><text x="140" y="220" font-size="15">Completion export</text><text x="410" y="160" font-size="19" font-weight="bold">Customer SFTP</text><text x="410" y="195" font-size="15">Restricted landing</text><text x="410" y="220" font-size="15">Separate CPI reader</text><text x="680" y="160" font-size="19" font-weight="bold">SAP CPI</text><text x="680" y="195" font-size="15">Validate and map</text><text x="680" y="220" font-size="15">SFTP sender / receiver</text><text x="955" y="160" font-size="19" font-weight="bold">SAP Learning</text><text x="955" y="195" font-size="15">SAP-managed SFTP</text><text x="955" y="220" font-size="15">History Connector</text></g><g stroke="#23754e" stroke-width="4" fill="none"><path d="M250 200H296"/><path d="M520 200H566"/><path d="M790 200H836"/></g><g fill="#23754e"><path d="M295 193l12 7-12 7"/><path d="M565 193l12 7-12 7"/><path d="M835 193l12 7-12 7"/></g><text x="35" y="350" font-size="18" font-family="Arial" fill="#17432c" font-weight="bold">Pixaera has NO SAP SFTP credentials and NO SAP-facing private key.</text><text x="35" y="385" font-size="15" font-family="Arial" fill="#526d5d">Reference architecture; tenant endpoint, connector configuration and authentication require validation.</text></svg>