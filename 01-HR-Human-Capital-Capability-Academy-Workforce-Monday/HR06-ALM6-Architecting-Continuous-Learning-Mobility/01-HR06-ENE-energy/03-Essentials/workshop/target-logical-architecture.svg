<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">Energy learning target logical architecture</title><desc id="desc">Three ownership zones separate Pixaera capture, enterprise validation and secure file exchange, and SAP Learning records. An operations plane reconciles source events and import results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="hsl(155,60%,28%)"/></marker></defs><style>text{font-family:Comfortaa,Arial,sans-serif;fill:hsl(155,42%,20%)}.label{font-size:13px}.title{font-size:14px;font-weight:700}.heading{font-size:19px;font-weight:700}.edge{font-size:12px}.canvas{fill:hsl(100,60%,98%)}.capability{fill:hsl(85,75%,88%)}.zone{fill:hsl(145,42%,96%);stroke:hsl(150,30%,55%);stroke-dasharray:6 4}.component{fill:white;stroke:hsl(150,36%,48%);stroke-width:1.5}.ops{fill:hsl(195,55%,93%);stroke:hsl(195,35%,55%)}.link{fill:none;stroke:hsl(155,60%,28%);stroke-width:2}.control{stroke-dasharray:5 4}</style><rect x="10" y="10" width="1080" height="790" rx="12" class="canvas"/><text x="35" y="45" class="heading">TARGET ARCHITECTURE · ENERGY LEARNING ASSURANCE</text><text x="35" y="72" class="label">Proposed logical view · Daily batch · Tenant configuration and ownership to be verified</text><rect x="30" y="100" width="1040" height="68" rx="12" class="capability"/><text x="50" y="128" class="title">BUSINESS CAPABILITY</text><text x="50" y="151" class="label">Workforce safety learning  /  Approved completion evidence  /  Auditable learning credit</text><rect x="30" y="190" width="310" height="385" rx="12" class="zone"/><text x="45" y="218" class="title">PIXAERA / SOURCE ZONE</text><rect x="375" y="190" width="310" height="385" rx="12" class="zone"/><text x="390" y="218" class="title">ENTERPRISE INTEGRATION ZONE</text><rect x="720" y="190" width="350" height="385" rx="12" class="zone"/><text x="735" y="218" class="title">SAP LEARNING / TARGET ZONE</text><rect x="50" y="245" width="270" height="100" rx="12" class="component"/><text x="66" y="272" class="title">Completion capture</text><text x="66" y="297" class="label">Classroom / QR attendance</text><text x="66" y="316" class="label">Business-approved completion</text><rect x="50" y="440" width="270" height="100" rx="12" class="component"/><text x="66" y="467" class="title">Source event ledger</text><text x="66" y="492" class="label">Immutable event ID + batch ID</text><text x="66" y="511" class="label">Evidence and replay tracking</text><rect x="395" y="245" width="270" height="100" rx="12" class="component"/><text x="411" y="272" class="title">Export &amp; validation</text><text x="411" y="297" class="label">Canonical LMS identity + item</text><text x="411" y="316" class="label">Schema / dates / replay guard</text><rect x="395" y="440" width="270" height="100" rx="12" class="component"/><text x="411" y="467" class="title">Secure SFTP landing</text><text x="411" y="492" class="label">Restricted inbound directory</text><text x="411" y="511" class="label">Separate test / production</text><rect x="740" y="245" width="310" height="100" rx="12" class="component"/><text x="756" y="272" class="title">Learning History Connector</text><text x="756" y="297" class="label">Scheduled native batch import</text><text x="756" y="316" class="label">Tenant-specific parsing settings</text><rect x="740" y="440" width="310" height="100" rx="12" class="component"/><text x="756" y="467" class="title">Authoritative learning record</text><text x="756" y="492" class="label">Item / status / completion date</text><text x="756" y="511" class="label">Credit hours + rejection logs</text><path d="M320 290 H395" class="link" marker-end="url(#arrow)"/><text x="326" y="278" class="edge">I1 · extract</text><path d="M530 345 V440" class="link" marker-end="url(#arrow)"/><text x="540" y="395" class="edge">I2 · SFTP file</text><path d="M665 487 H704 V292 H740" class="link" marker-end="url(#arrow)"/><text x="674" y="418" class="edge">I3 · read</text><path d="M895 345 V440" class="link" marker-end="url(#arrow)"/><text x="905" y="395" class="edge">I4 · post / reject</text><path d="M185 345 V440" class="link control" marker-end="url(#arrow)"/><text x="195" y="395" class="edge">Event audit</text><rect x="30" y="615" width="1040" height="115" rx="12" class="ops"/><text x="50" y="643" class="title">OPERATIONS &amp; ASSURANCE · INTEGRATION OPS + LMS + LEARNING OWNER</text><text x="50" y="671" class="label">Reconciliation ledger   |   Exceptions &amp; alerts   |   Human-approved remediation   |   Controlled replay</text><text x="50" y="700" class="label">Approved source events = posted + rejected + pending · Correlate event, file and connector run IDs</text><path d="M185 540 V615" class="link control" marker-end="url(#arrow)"/><path d="M895 540 V615" class="link control" marker-end="url(#arrow)"/><text x="40" y="758" class="label">Solid arrow: completion data     Dashed arrow: audit / control evidence</text><text x="40" y="782" class="label">Boundary: history credit only · No course launch, OT access or automatic work-permit authorization</text></svg>