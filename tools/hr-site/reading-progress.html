<style id="sla-reading-progress-style">
:root{--sla-reading-progress-color:var(--deep,hsl(195 45% 17%))}
#sla-reading-progress{position:fixed;inset:var(--sla-reading-progress-top,0px) 0 auto;height:6px;z-index:2147483647;pointer-events:none;background:hsl(195 20% 85% / .4)}
#sla-reading-progress-fill{display:block;width:100%;height:100%;background:var(--sla-reading-progress-color);transform:scaleX(0);transform-origin:left center}
@media print{#sla-reading-progress{display:none}}
</style>
<div id="sla-reading-progress" aria-hidden="true"><span id="sla-reading-progress-fill"></span></div>
<script id="sla-reading-progress-script">
(()=>{'use strict';
const fill=document.getElementById('sla-reading-progress-fill');const readingHeader=document.querySelector('body > header');let pending=false;
function update(){pending=false;if(readingHeader)document.documentElement.style.setProperty('--sla-reading-progress-top',Math.max(0,readingHeader.getBoundingClientRect().bottom)+'px');const doc=document.scrollingElement||document.documentElement;
const range=doc.scrollHeight-doc.clientHeight;
const value=range>0?Math.min(1,Math.max(0,doc.scrollTop/range)):0;
fill.style.transform='scaleX('+value+')';}
function schedule(){if(!pending){pending=true;requestAnimationFrame(update);}}
window.addEventListener('scroll',schedule,{passive:true});
window.addEventListener('resize',schedule,{passive:true});
window.addEventListener('pageshow',schedule);window.addEventListener('hashchange',schedule);
if(window.ResizeObserver){const observer=new ResizeObserver(schedule);observer.observe(document.body);if(readingHeader)observer.observe(readingHeader);}
update();})();
</script>
